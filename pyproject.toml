[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-doc-checker"
version = "1.0.0"
description = "Fixed-step supplier document checker for BIAI AI Engineer Round 2, Task 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "pydantic>=2.0",
  "pdfplumber>=0.11",
  "rich>=13.0",
  "anthropic>=0.40",
  "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
checker = "checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
